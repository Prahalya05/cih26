# Render blueprint (Step 13.2). In Render: New > Blueprint, pick this repository.
# Secrets marked sync: false are typed into the Render dashboard, never committed.
services:
  - type: web
    name: disha
    runtime: docker
    region: singapore          # closest Render region to Tamil Nadu
    plan: free                 # sleeps when idle (about 1 min to wake); starter (paid) stays up
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL      # Supabase session pooler URL (IPv4); percent-encode the password
        sync: false
      - key: GEMINI_API_KEY    # optional; paid tier for real students
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: AUTH_SECRET       # keys the HMAC that hides phone numbers and emails (accounts.py)
        generateValue: true
      - key: OTP_DEMO          # 1 = show sign-in codes on screen (no SMS/email provider yet); 0 for a real pilot
        value: "1"
      - key: PAYMENTS_DEMO     # 1 = labelled demo course payments when no Razorpay keys are set
        value: "1"
      - key: RAZORPAY_KEY_ID   # Razorpay test-mode keys (rzp_test_...); optional
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CORS_ORIGINS      # the public address, e.g. https://disha.example.in
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DB_POOL_MAX       # per worker; keep workers x this under the Supabase pooler limit
        value: "5"             # 2 workers x 5 = 10, under the Supabase free pool of 15
